name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check empireoe_core tests
      - name: Tests with coverage
        run: pytest tests/ -q --tb=short --cov=empireoe_core --cov-report=term-missing --cov-fail-under=50
      - name: Security scan
        run: pip install bandit && bandit -r empireoe_core -ll -q
